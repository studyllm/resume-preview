name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance 签名

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Verify plugin version matches package version
        run: |
          pkg=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$pkg" != "$plugin" ]; then
            echo "version mismatch: package.json=$pkg plugin.json=$plugin" >&2
            exit 1
          fi

      - run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
