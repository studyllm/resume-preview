<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{PAGE_TITLE}}</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/shared.css" />
    <link rel="stylesheet" href="/gallery.css" />
  </head>
  <body>
    {{NAV}}

    <div class="container">
      <header class="gallery-header">
        <div class="gallery-title-row">
          <h1 class="gallery-title">{{i18n:gallery.title}}</h1>
          {{LANG_SWITCH}}
        </div>
        <p class="gallery-subtitle">{{i18n:gallery.subtitle}}</p>

        <div class="search-bar mt-lg">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            class="input search-input"
            placeholder="{{i18n:gallery.searchPlaceholder}}"
            autocomplete="off"
          />
        </div>
      </header>

      <div class="gallery-stats mt-md">
        <span class="text-muted" id="resumeCount">{{i18n:gallery.loading}}</span>
      </div>

      <div id="gallery" class="gallery-grid mt-lg">
        <div class="loading">
          <div class="loading-spinner"></div>
        </div>
      </div>

      <div id="emptyState" class="empty-state" style="display: none">
        <div class="empty-state-icon">📄</div>
        <h2 class="empty-state-title">{{i18n:gallery.emptyTitle}}</h2>
        <p class="empty-state-description">{{i18n:gallery.emptyDesc}}</p>
      </div>

      <div id="noResults" class="empty-state" style="display: none">
        <div class="empty-state-icon">🔍</div>
        <h2 class="empty-state-title">{{i18n:gallery.noResultsTitle}}</h2>
        <p class="empty-state-description">{{i18n:gallery.noResultsDesc}}</p>
      </div>
    </div>

    {{FOOTER}} {{PAGE_SCRIPTS}}
  </body>
</html>
